<!-- Course pages: tutor box removed -->

  <h2>Meet Your Tutor</h2>

  <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">

    <img
      src="tutor.jpg"
      alt="Jean Bosco - English Tutor"
      style="width:150px;height:150px;object-fit:cover;border-radius:50%;"
    >

    <div>
      <h3>Jean Bosco – Your English Tutor</h3>
      <p>Welcome to Bosco English Academy!</p>
      <p>Learn English step by step. Ask questions and receive helpful explanations whenever you need support.</p>
    </div>

  </div>

  <h3>Ask Jean Bosco a Question</h3>

  <textarea
    id="tutorQuestion"
    placeholder="Ask me anything about English..."
    rows="4"
    style="width:100%;padding:12px;margin-bottom:12px;"
  ></textarea>

  <button type="button" id="sendTutorQuestion">
    Send Question
  </button>

  <p id="tutorMessageStatus" role="status" aria-live="polite"></p>

  <div id="tutorReply" class="example" hidden></div>

</section>
