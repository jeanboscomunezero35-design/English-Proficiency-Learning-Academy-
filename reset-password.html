<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | English Proficiency Learning Academy</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h2 {
  text-align: center;
  color: #173b70;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border-radius: 6px;
}
input { border: 1px solid #ccc; }
button {
  background: #173b70;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
#message {
  margin-top: 15px;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
<h2>Reset your password</h2>
<p>Enter your new password below.</p>

<form id="resetForm">

<input type="password" id="newPassword"
placeholder="New password" minlength="6" required>

<input type="password" id="confirmPassword"
placeholder="Confirm new password" minlength="6" required>

<button type="submit" id="resetButton" disabled>
Verifying reset link...
</button>

</form>

<p id="message">Please wait...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const client = window.supabase.createClient(
'https://arnlcdpncwuruacaqjko.supabase.co',
'sb_publishable_G8P0TF0s0GD-vTcvaghAOg_HtIzVxp-',
{
  auth: {
    detectSessionInUrl: false,
    persistSession: true,
    autoRefreshToken: true
  }
}
);

const form = document.getElementById('resetForm');
const button = document.getElementById('resetButton');
const message = document.getElementById('message');

let recoveryReady = false;

async function verifyLink() {
  try {
    const url = new URL(window.location.href);

    const tokenHash = url.searchParams.get('token_hash');
    const type = url.searchParams.get('type');
    const code = url.searchParams.get('code');

    let session = null;

    // Format 1: Token hash
    if (tokenHash && type === 'recovery') {
      const { data, error } = await client.auth.verifyOtp({
        token_hash: tokenHash,
        type: 'recovery'
      });

      if (error) throw error;
      session = data.session;
    }

    // Format 2: PKCE authorization code
    else if (code) {
      const { data, error } =
        await client.auth.exchangeCodeForSession(code);

      if (error) throw error;
      session = data.session;
    }

    // Format 3: Access and refresh tokens in URL hash
    else {
      const hash = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const recoveryType = hash.get('type');

      if (accessToken && refreshToken && recoveryType === 'recovery') {
        const { data, error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) throw error;
        session = data.session;
      }
    }

    if (!session) {
      throw new Error(
        'Your recovery link is invalid or expired. Please request a new email.'
      );
    }

    recoveryReady = true;

    button.disabled = false;
    button.textContent = 'Update password';

    message.textContent =
      'Your recovery link is verified. Choose your new password.';

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (error) {
    message.textContent =
      error.message || 'Unable to verify your recovery link.';
  }
}

verifyLink();

form.addEventListener('submit', async function(event) {
  event.preventDefault();

  if (!recoveryReady) {
    message.textContent = 'Please verify your recovery link first.';
    return;
  }

  const password =
    document.getElementById('newPassword').value;

  const confirmation =
    document.getElementById('confirmPassword').value;

  if (password.length < 6) {
    message.textContent = 'Password must contain at least 6 characters.';
    return;
  }

  if (password !== confirmation) {
    message.textContent = 'Your passwords do not match.';
    return;
  }

  button.disabled = true;
  message.textContent = 'Updating your password...';

  try {
    const { error } = await client.auth.updateUser({
      password: password
    });

    if (error) throw error;

    recoveryReady = false;

    message.textContent =
      'Password updated successfully! You can now log in.';

    form.reset();

    await client.auth.signOut();

  } catch (error) {
    message.textContent =
      error.message || 'Unable to update your password.';

    button.disabled = false;
  }
});
</script>

</body>
</html>
