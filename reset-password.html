<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | English Proficiency Learning Academy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #173b70;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #173b70;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Reset your password</h2>

    <p>Enter your new password below.</p>

    <form id="resetForm">
      <input
        type="password"
        id="newPassword"
        placeholder="New password"
        minlength="6"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit" id="resetButton">
        Update password
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://arnlcdpncwuruacaqjko.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_G8P0TF0s0GD-vTcvaghAOg_HtIzVxp-';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const resetForm = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const resetButton = document.getElementById('resetButton');

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword =
        document.getElementById('newPassword').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      resetButton.disabled = true;
      message.textContent = 'Updating your password...';

      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            'Your reset link is invalid or expired. Please request another reset email.'
          );
        }

        const { error: updateError } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });

        if (updateError) throw updateError;

        message.textContent =
          'Password updated successfully! You can now log in with your new password.';

        resetForm.reset();

      } catch (error) {
        message.textContent =
          error.message || 'Unable to update password.';
      } finally {
        resetButton.disabled = false;
      }
    });
  </script>

</body>
</html>
