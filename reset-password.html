<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | English Proficiency Learning Academy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #173b70;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #173b70;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Reset your password</h2>

  <p>Enter your new password below.</p>

  <form id="resetForm">

    <input
      type="password"
      id="newPassword"
      placeholder="New password"
      minlength="6"
      required
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
      required
    >

    <button type="submit" id="resetButton" disabled>
      Verify your reset link...
    </button>

  </form>

  <p id="message">Verifying your reset link...</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://arnlcdpncwuruacaqjko.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_G8P0TF0s0GD-vTcvaghAOg_HtIzVxp-';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      detectSessionInUrl: false,
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

const resetForm = document.getElementById('resetForm');
const message = document.getElementById('message');
const resetButton = document.getElementById('resetButton');

let recoveryReady = false;

async function verifyRecoveryLink() {

  try {

    const url = new URL(window.location.href);

    const tokenHash = url.searchParams.get('token_hash');
    const type = url.searchParams.get('type');

    if (!tokenHash || type !== 'recovery') {
      throw new Error(
        'Invalid or missing recovery link. Please request a new password reset email.'
      );
    }

    const { data, error } =
      await supabaseClient.auth.verifyOtp({
        token_hash: tokenHash,
        type: 'recovery'
      });

    if (error) throw error;

    if (!data.session) {
      throw new Error(
        'Your recovery link could not be verified. Please request another email.'
      );
    }

    recoveryReady = true;

    resetButton.disabled = false;
    resetButton.textContent = 'Update password';

    message.textContent =
      'Your reset link is valid. You can now choose a new password.';

    // Remove the recovery token from the visible address.
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  } catch (error) {

    message.textContent =
      error.message || 'Unable to verify your reset link.';

    resetButton.disabled = true;

  }

}

verifyRecoveryLink();

resetForm.addEventListener('submit', async function(event) {

  event.preventDefault();

  if (!recoveryReady) {
    message.textContent =
      'Your reset link is not verified. Please request a new email.';
    return;
  }

  const newPassword =
    document.getElementById('newPassword').value;

  const confirmPassword =
    document.getElementById('confirmPassword').value;

  if (newPassword.length < 6) {
    message.textContent =
      'Your password must contain at least 6 characters.';
    return;
  }

  if (newPassword !== confirmPassword) {
    message.textContent =
      'Your passwords do not match.';
    return;
  }

  resetButton.disabled = true;
  message.textContent = 'Updating your password...';

  try {

    const { error } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) throw error;

    message.textContent =
      'Password updated successfully! You can now log in with your new password.';

    recoveryReady = false;

    resetForm.reset();

    await supabaseClient.auth.signOut();

  } catch (error) {

    message.textContent =
      error.message || 'Unable to update your password.';

    resetButton.disabled = false;

  }

});

</script>

</body>
</html>
